---
layout: default
title: Home
---

<div class="frontpage">
    {% for post in paginator.posts %}
        <div class="frontpage-item">
            <span class="frontpage-time has-text-grey-light">
              <time datetime="{{ post.date }}">{{ post.date | date_es }}</time>
            </span>
            <a href="{{ post.url | prepend: site.baseurl }}">
                <h3 class="title is-4">{{ post.title }}</h3>
            </a>
            <p class="has-text-grey">{{ post.description }}</h3>
        </div>
    {% endfor %}
</div>

{% include pagination.html %}
