# Configuración del sitio
title: Ingeniero y no puedo
description: El blog personal de Juanjo Salvador
baseurl: "/blog"
url: "https://jsalvador.me"

# Configuración de autor
author:
  name: Juanjo Salvador
  url: http://jsalvador.me
  email: juanjosalvador@netc.eu
  github: JuanjoSalvador
  twitter: Linuxneitor
  mastodon: https://mastodon.social/@jsalvador

# Configuración de construcción
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Configuración de salida
permalink: pretty
paginate: 5
paginate_path: "/:num/"

# Configuración de assets
sass:
  style: compressed
  sourcemap: never  # Nueva opción en Jekyll 4

# Optimización de rendimiento
compress_html:
  clippings: all
  comments: all
  endings: all
  blanklines: false

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-og-image

# Exclusiones
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE

# Configuración de caché
incremental: true  # Característica mejorada en Jekyll 4

# Variables personalizadas
version: 4.3.3
color: dark